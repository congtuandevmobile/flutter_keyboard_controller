name: flutter_keyboard_controller
description: >-
  A Flutter plugin for smooth keyboard animation tracking.
  Mirrors react-native-keyboard-controller with frame-by-frame keyboard
  height/progress updates, KeyboardAvoidingView, KeyboardAwareScrollView,
  KeyboardStickyView, KeyboardToolbar, and KeyboardChatScrollView.
version: 1.0.0
homepage: https://github.com/your-org/flutter_keyboard_controller

environment:
  sdk: ^3.3.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_keyboard_controller
        pluginClass: FlutterKeyboardControllerPlugin
      ios:
        pluginClass: FlutterKeyboardControllerPlugin
