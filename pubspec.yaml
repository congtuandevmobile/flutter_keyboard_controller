name: flutter_keyboard_controller
description: >-
  Smooth, frame-by-frame keyboard animation tracking for Flutter.
  Includes KeyboardChatScrollView, KeyboardToolbar, KeyboardStickyView,
  KeyboardAwareScrollView, and KeyboardAvoidingView — everything you need
  to build polished keyboard-aware UIs on iOS and Android.
version: 0.0.4
homepage: https://github.com/congtuandevmobile/flutter_keyboard_controller

environment:
  sdk: ^3.3.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_keyboard_controller
        pluginClass: FlutterKeyboardControllerPlugin
      ios:
        pluginClass: FlutterKeyboardControllerPlugin
